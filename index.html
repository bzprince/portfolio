<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badhruz Zaman — Developer & Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#04060d;--navy:#0a1226;--navy2:#101c3a;--cyan:#38e1ff;--blue:#2f6bff;--red:#ff3b4e;--text:#e8edf7;--mute:#97a3bd;--line:rgba(160,190,255,.16);--glass:rgba(16,28,58,.45);
--d:'Syne','Arial Black',sans-serif;--b:'Manrope',system-ui,sans-serif;--pad:max(clamp(1.25rem,5vw,5rem),calc((100vw - 1400px)/2))}
img,iframe{max-width:100%}h1,h2,h3,p{overflow-wrap:anywhere}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:4rem;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--ink);color:var(--text);font:400 1.05rem/1.7 var(--b);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
section{padding:clamp(5rem,12vw,10rem) var(--pad);position:relative}
h2{font:800 clamp(2.4rem,7vw,6rem)/.95 var(--d);letter-spacing:-.03em}
.mute{color:var(--mute)}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(1rem + env(safe-area-inset-top,0px)) var(--pad) 1rem;backdrop-filter:blur(14px);background:linear-gradient(var(--ink),transparent)}
nav b{font:800 1.1rem var(--d)}nav b i{color:var(--red);font-style:normal}
nav ul{display:flex;gap:clamp(.9rem,3vw,2.2rem);list-style:none;padding:0;font-size:.9rem}
nav li a{position:relative;padding:.3rem 0;color:var(--mute);transition:color .3s}
nav li a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--cyan);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
nav li a:hover{color:var(--text)}nav li a:hover::after{transform:scaleX(1)}
@media(max-width:640px){nav li:nth-child(-n+2){display:none}}

/* hero */
.hero{min-height:100svh;display:grid;align-items:end;overflow:hidden;background:radial-gradient(60% 50% at 78% 30%,rgba(47,107,255,.35),transparent 70%),radial-gradient(40% 40% at 15% 90%,rgba(56,225,255,.16),transparent 70%),var(--navy)}
.hero::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg at 70% 35%,transparent,rgba(56,225,255,.12),transparent 30%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-in{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:2rem;align-items:end;padding-top:7rem}
.hero h1{font:800 clamp(3.6rem,13.5vw,12.5rem)/.82 var(--d);letter-spacing:-.045em;position:relative;z-index:2}
.hero h1 span{display:block;overflow:hidden}
.hero h1 span em{display:block;font-style:normal;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.hero h1 span:nth-child(2) em{animation-delay:.18s;color:transparent;-webkit-text-stroke:1.5px var(--cyan)}
@keyframes rise{from{transform:translateY(105%)}}
.role{margin-top:2rem;font-weight:600;color:var(--cyan);animation:fade 1s .7s both}
.intro{max-width:30ch;font-size:1.25rem;color:var(--text);margin-top:.6rem;animation:fade 1s .9s both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
.frame{position:relative;aspect-ratio:3/4;max-width:420px;justify-self:center;width:100%;animation:fade 1.4s .4s both}
.frame .shape{position:absolute;inset:0;clip-path:polygon(18% 0,100% 0,100% 82%,82% 100%,0 100%,0 18%);background:linear-gradient(160deg,var(--navy2),#050a18);border:1px solid var(--line)}
.frame .shape::after{content:"BZ";position:absolute;inset:0;display:grid;place-items:center;font:800 7rem var(--d);color:rgba(56,225,255,.12)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:polygon(18% 0,100% 0,100% 82%,82% 100%,0 100%,0 18%)}
.ring{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;border:1px solid var(--cyan);right:-14%;top:-8%;animation:float 9s ease-in-out infinite}
.dot{position:absolute;width:1.1rem;height:1.1rem;background:var(--red);border-radius:50%;left:-6%;bottom:14%;box-shadow:0 0 30px var(--red);animation:float 7s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(-18px)}}
.scroll{position:absolute;left:var(--pad);bottom:2rem;display:flex;gap:.8rem;align-items:center;font-size:.8rem;color:var(--mute)}
.scroll i{width:1px;height:48px;background:linear-gradient(var(--cyan),transparent);animation:drop 2s ease-in-out infinite;transform-origin:top}
@keyframes drop{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media(max-width:820px){.hero-in{grid-template-columns:1fr}.frame{max-width:260px;justify-self:end;order:-1;margin-top:1rem}.scroll{display:none}.hero{padding-bottom:3rem}}

/* about */
.about{display:grid;grid-template-columns:5fr 7fr;gap:clamp(2rem,6vw,6rem)}
.about .side{position:sticky;top:6rem;align-self:start}
.about .side h2{margin-bottom:1.5rem}
.big{font:600 clamp(1.4rem,2.6vw,2.2rem)/1.3 var(--d);margin-bottom:2rem}
.about p{max-width:62ch;margin-bottom:1.2rem;color:var(--mute)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:2.5rem;border:1px solid var(--line)}
.facts div{background:var(--ink);padding:1.2rem}
.facts small{display:block;color:var(--mute);font-size:.8rem}
.facts b{font:600 1.05rem var(--d)}
@media(max-width:820px){.about{grid-template-columns:1fr}.about .side{position:static}}

/* skills */
.skills{background:var(--navy)}
.sk-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:3rem 2rem;margin-top:4rem}
.sk-wrap h3{font:600 1rem var(--d);color:var(--cyan);padding-bottom:1rem;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);border-radius:100px;font-size:.92rem;transition:transform .35s,border-color .35s,box-shadow .35s}
.chip:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 8px 30px -8px rgba(56,225,255,.5)}
.chip svg{width:18px;height:18px;stroke:var(--cyan);fill:none;stroke-width:1.6}
.chip.learn{border-style:dashed;color:var(--mute)}
.note{margin-top:2.5rem;color:var(--mute);font-size:.9rem}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(1rem,2.5vw,2rem);margin-top:4rem}
.proj{position:relative;overflow:hidden;border:1px solid var(--line);min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;padding:1.8rem;isolation:isolate;transition:border-color .4s}
.proj:hover{border-color:var(--cyan)}
.proj .art{position:absolute;inset:0;z-index:-1;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.proj:hover .art{transform:scale(1.08)}
.proj::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 15%,rgba(4,6,13,.95))}
.proj small{color:var(--cyan);font-size:.85rem}
.proj h3{font:800 clamp(1.6rem,3.2vw,2.8rem)/1 var(--d);margin:.4rem 0 .6rem;letter-spacing:-.02em}
.proj p{color:var(--mute);max-width:42ch;font-size:.95rem}
.p1{grid-column:span 7;min-height:520px}.p2{grid-column:span 5;margin-top:4rem}.p3{grid-column:span 5}.p4{grid-column:span 7;min-height:420px}
.p1 .art{background:repeating-linear-gradient(90deg,transparent 0 49.4%,rgba(255,255,255,.55) 49.4% 50.6%,transparent 50.6%) center/100% 100%,linear-gradient(180deg,#0b1a3d 0%,#101c3a 40%,#1a2547 40.1%,#060a16 100%)}
.p1 .art::before{content:"";position:absolute;inset:40% 0 0;background:repeating-linear-gradient(0deg,rgba(56,225,255,.25) 0 2px,transparent 2px 38px);transform:perspective(300px) rotateX(55deg);transform-origin:top;animation:road 1.4s linear infinite}
@keyframes road{to{background-position:0 38px}}
.p1 .art::after{content:"";position:absolute;left:50%;top:22%;width:120px;height:120px;border-radius:50%;transform:translateX(-50%);background:var(--red);box-shadow:0 0 90px 20px rgba(255,59,78,.5)}
